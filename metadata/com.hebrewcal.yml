Summary: Hebrew date and zmanim on your lockscreen
Description: |-
  Displays the current Hebrew date as a persistent lockscreen notification
  and home screen widget, with Jewish holidays, weekly parsha, halachic
  prayer times (zmanim), and Omer count.

  See the full description in fastlane/metadata/android/en-US/.

